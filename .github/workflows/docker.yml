name: docker

# Multi-arch GHCR images. Kept separate from the dist-managed release.yml so
# `dist generate` can own that file without merge conflicts.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build cache (layers + dependency fetch) persisted across runs in the
      # GitHub Actions cache; mode=max exports intermediate layers too.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/jianyun8023/kimi-responses-adapter:${{ github.ref_name }}
            ghcr.io/jianyun8023/kimi-responses-adapter:latest
          labels: |
            org.opencontainers.image.title=kimi-responses-adapter
            org.opencontainers.image.description=OpenAI Responses API adapter for the Kimi Code Anthropic API
            org.opencontainers.image.url=https://github.com/jianyun8023/kimi-responses-adapter
            org.opencontainers.image.source=https://github.com/jianyun8023/kimi-responses-adapter
            org.opencontainers.image.version=${{ github.ref_name }}
