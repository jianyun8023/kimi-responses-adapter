[tools]
rust = "stable"
cargo-dist = "latest"

[tasks.build]
description = "Compile all targets"
run = "cargo build"

[tasks.test]
description = "Run all unit + httptest-based end-to-end tests"
run = "cargo test"

[tasks.lint]
description = "Static analysis (clippy, warnings denied)"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt"

[tasks.run]
description = "Serve on :8787 (LISTEN_ADDR to override)"
run = "cargo run"

[tasks.ci]
description = "fmt check + clippy + tests (what CI runs)"
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings", "cargo test"]

# One-step release: dist requires the pushed tag to match the version in
# Cargo.toml, so bump/commit/tag/push happen together instead of by hand.
[tasks.release]
description = "Bump version, commit, tag and push a release (mise run release <x.y.z>)"
usage = 'arg "<version>" help="version to release (x.y.z)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

version="${usage_version:?missing <version>}"
if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
  echo "error: version must be semver x.y.z (got '$version')" >&2
  exit 1
fi
tag="v${version}"

if ! git diff --quiet || ! git diff --cached --quiet; then
  echo "error: working tree is dirty; commit or stash first" >&2
  exit 1
fi
if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
  echo "error: tag ${tag} already exists" >&2
  exit 1
fi

current="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
echo "bumping ${current} -> ${version}"
tmp="$(mktemp)"
sed "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml > "$tmp"
mv "$tmp" Cargo.toml
# Refresh Cargo.lock with the new package version (no compilation).
cargo metadata --format-version 1 > /dev/null

git add Cargo.toml Cargo.lock
git commit -m "chore(release): ${version}"
git tag "${tag}"
# Push the version-bump commit first, then the tag, so the workflows never
# see a tag whose Cargo.toml version lags behind.
git push origin HEAD
git push origin "${tag}"
echo "released ${tag}; watch https://github.com/jianyun8023/kimi-responses-adapter/actions"
'''
