[package]
name = "kimi-responses-adapter"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "OpenAI Responses API adapter for the Kimi Code Anthropic API"
license = "MIT"
repository = "https://github.com/jianyun8023/kimi-responses-adapter"

[dependencies]
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
