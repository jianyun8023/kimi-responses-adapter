version: 2

project_name: kimi-responses-adapter

before:
  hooks:
    - go mod tidy

builds:
  - id: kimi-responses-adapter
    main: ./cmd/kimi-responses-adapter
    binary: kimi-responses-adapter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# dockers_v2 builds and pushes the multi-arch manifest in a single
# `docker buildx` run; no separate docker_manifests wiring is needed.
dockers_v2:
  - id: kimi-responses-adapter
    ids:
      - kimi-responses-adapter
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    images:
      - ghcr.io/jianyun8023/kimi-responses-adapter
    tags:
      - "{{ .Version }}"
      - latest
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "OpenAI Responses API adapter for the Kimi Code Anthropic API"
      org.opencontainers.image.url: "https://github.com/jianyun8023/kimi-responses-adapter"
      org.opencontainers.image.source: "https://github.com/jianyun8023/kimi-responses-adapter"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: '{{ time "2006-01-02T15:04:05Z07:00" }}'
      org.opencontainers.image.revision: "{{ .FullCommit }}"

release:
  github:
    owner: jianyun8023
    name: kimi-responses-adapter
